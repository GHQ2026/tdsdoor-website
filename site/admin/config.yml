# Sveltia CMS 配置（拓达昇官网内容后台）
# 工作流程：浏览器登录 → 编辑下方字段 → 保存 → 写入 GitHub 仓库 content/content.json
#           → EdgeOne Pages 检测到推送 → 自动运行 python src/build.py → 全站重新上线
# 登录：访问 /admin/ → 点「Sign in with access token」→ 粘贴 GitHub 个人访问令牌（PAT）
#       令牌只需生成一次，浏览器会记住（详见《网站内容编辑手册》）。

backend:
  name: github
  repo: GHQ2026/tdsdoor-website
  branch: main
  # 登录方式：仅使用「个人访问令牌(PAT)」。
  # 只需你本人在 GitHub 生成一个令牌粘贴一次即可，
  # 不需要注册 Cloudflare、不需要 OAuth App、不需要额外服务器。
  auth_methods: [token]
  # 注意：这里刻意【不配置 base_url】——一旦配置就会走 OAuth 流程，需要额外的鉴权服务器。

# 图片上传目录（相对于仓库根）；发布后通过 /assets/images/xxx.jpg 访问
media_folder: "site/assets/images"
public_folder: "/assets/images"

collections:
  - name: content
    label: "站点内容"
    files:
      - name: site
        label: "全站内容 (content.json)"
        file: "content/content.json"
        fields:
          - name: site
            label: "站点基础信息"
            widget: object
            fields:
              - { name: COMPANY,  label: "公司全称", widget: string }
              - { name: SLOGAN,   label: "品牌标语", widget: string }
              - { name: PHONE,    label: "电话", widget: string }
              - { name: EMAIL,    label: "邮箱", widget: string }
              - { name: ADDR,     label: "地址", widget: string }
              - { name: HERO_TITLE, label: "首页主标题", widget: string }
              - { name: HERO_SUB, label: "首页副标题", widget: text }
              - { name: HERO_MOTTO, label: "首页口号", widget: string }
          - name: news
            label: "新闻动态"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: date,    label: "发布日期", widget: datetime, date_format: "YYYY-MM-DD", time_format: false }
              - { name: title,   label: "标题", widget: string }
              - { name: summary, label: "摘要", widget: text }
          - name: cases
            label: "案例与方案"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title,    label: "案例标题", widget: string }
              - { name: industry, label: "所属行业", widget: string }
              - { name: desc,     label: "案例描述", widget: text }
          - name: products
            label: "核心工业门产品（6 大主打）"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name,    label: "产品名称", widget: string }
              - { name: slug,    label: "slug(英文标识)", widget: string }
              - { name: en,      label: "英文名", widget: string }
              - { name: tagline, label: "一句话卖点", widget: string }
              - { name: image,   label: "封面图", widget: image }
              - name: desc
                label: "产品简介(段落)"
                widget: list
                field: { name: p, label: "段落", widget: text }
              - name: features
                label: "核心特点"
                widget: list
                summary: "{{fields.title}}"
                field:
                  widget: object
                  fields:
                    - { name: num, label: "序号", widget: string }
                    - { name: title, label: "标题", widget: string }
                    - { name: text, label: "说明", widget: text }
              - name: specs
                label: "技术参数"
                widget: list
                summary: "{{fields.label}}"
                field:
                  widget: object
                  fields:
                    - { name: label, label: "参数项", widget: string }
                    - { name: value, label: "规格说明", widget: string }
              - name: apps
                label: "应用行业"
                widget: list
                field: { name: app, label: "行业", widget: string }
          - name: categories
            label: "产品体系全景（6 大类）"
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: "大类名称", widget: string }
              - { name: slug, label: "slug", widget: string }
              - name: products
                label: "子类目"
                widget: list
                summary: "{{fields.name}}"
                field:
                  widget: object
                  fields:
                    - { name: name, label: "名称", widget: string }
                    - { name: slug, label: "slug", widget: string }
                    - { name: image, label: "图片", widget: image }
                    - { name: desc, label: "描述(可选)", widget: text }
          - name: about
            label: "关于我们页"
            widget: object
            fields:
              - { name: title, label: "标题", widget: string }
              - { name: subtitle, label: "副标题", widget: string }
              - name: intro
                label: "企业简介(段落)"
                widget: list
                field: { name: p, label: "段落", widget: text }
