<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>拓达昇内容后台</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .boot { display:flex; align-items:center; justify-content:center; height:100vh; color:#5a6b82; font-size:15px; }
  </style>
  <!-- Sveltia 官方配置引用方式：link 标签指向 JSON 配置文件 -->
  <!-- 注意：不用 config.yml 是因为部分托管平台 WAF 会误拦 .yml 扩展名（实测 403），.json 可正常访问 -->
  <link rel="cms-config-url" type="application/json" href="./config.json" />
</head>
<body>
  <div class="boot" id="boot">后台加载中，请稍候…</div>

  <!-- Sveltia CMS 0.129.3（本地托管，锁版本；不依赖海外 CDN，国内加载稳定） -->
  <script src="../assets/vendor/sveltia/sveltia-cms.min.js"></script>
  <script>
    // 若 CMS 脚本未加载成功，给出可读提示而不是白屏
    setTimeout(function () {
      var boot = document.getElementById('boot');
      if (boot && !document.querySelector('sveltia-cms')) {
        boot.innerHTML = '后台脚本未加载成功，请刷新重试或联系技术人员。';
      }
    }, 8000);
  </script>
</body>
</html>
