name: Build and Deploy

# 触发条件：推送到 main 分支（含 Sveltia 后台保存内容时自动产生的提交）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署任务，避免排队覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install Pillow

      - name: 生成全站
        run: python src/build.py

      - name: 质量门禁检查
        run: python src/tools/gate_check.py

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 备份站点压缩包（可随时下载）
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # 仓库未开启 Pages 时该步骤会失败，但不影响构建校验，故设为容错
        continue-on-error: true
